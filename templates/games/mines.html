{% extends 'base.html' %}
{% block title %}Mines Game - Luck2x Casino{% endblock %}
{% block content %}
<div class="container game-container">
    <div class="mb-4">
        <h2>💣 Mines Game</h2>
        <a href="/games" class="btn btn-secondary">← Back</a>
    </div>
    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <div class="mb-3">
                        <label>Mines to Avoid (1-24)</label>
                        <input type="number" id="mineCount" value="3" min="1" max="24">
                    </div>
                    <div class="mb-3">
                        <label>Bet Amount (KES)</label>
                        <input type="number" id="betAmount" value="100">
                    </div>
                    <button id="startBtn" class="btn btn-primary">START</button>
                    <button id="revealBtn" class="btn btn-success" disabled>REVEAL</button>
                    <button id="cashoutBtn" class="btn btn-warning" disabled>CASHOUT</button>

                    <div id="gameGrid" class="grid mt-4" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;"></div>

                    <div id="result" class="alert mt-3 hidden"></div>
                    <div class="mt-3">
                        <h5>Multiplier: <span id="multiplier">1.0x</span></h5>
                        <h5>Revealed: <span id="revealed">0</span>/24</h5>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5>Game Stats</h5>
                    <p>Grid Size: 5x5 (25 tiles)</p>
                    <p>Max Multiplier: 10x</p>
                    <p>RTP: 96%</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let gameId = null;
let grid = [];
let selectedTile = null;

document.getElementById('startBtn').addEventListener('click', startMines);
document.getElementById('revealBtn').addEventListener('click', revealTile);
document.getElementById('cashoutBtn').addEventListener('click', cashout);

async function startMines() {
    const betAmount = parseFloat(document.getElementById('betAmount').value);
    const mineCount = parseInt(document.getElementById('mineCount').value);
    const userId = sessionStorage.getItem('user_id');

    try {
        const response = await fetch('/api/games/mines/start', {
            method: 'POST',
            headers: {
                'User-ID': userId,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                bet_amount: betAmount,
                mine_count: mineCount
            })
        });

        const data = await response.json();
        gameId = data.game_id;

        // Draw grid
        const gridEl = document.getElementById('gameGrid');
        gridEl.innerHTML = '';
        grid = [];

        for (let i = 0; i < 25; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.style.cssText = 'padding:20px;background:#667eea;color:white;cursor:pointer;border-radius:8px;text-align:center;font-weight:bold;';
            tile.textContent = '?';
            tile.dataset.index = i;
            tile.addEventListener('click', () => {
                selectedTile = i;
                document.getElementById('revealBtn').disabled = false;
            });
            gridEl.appendChild(tile);
            grid.push(tile);
        }

        document.getElementById('startBtn').disabled = true;
        document.getElementById('cashoutBtn').disabled = false;

    } catch (err) {
        alert('Error starting game');
    }
}

async function revealTile() {
    if (selectedTile === null || !gameId) return;

    const userId = sessionStorage.getItem('user_id');

    try {
        const response = await fetch(`/api/games/mines/reveal/${gameId}`, {
            method: 'POST',
            headers: {
                'User-ID': userId,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ tile_index: selectedTile })
        });

        const data = await response.json();

        const tile = grid[selectedTile];
        if (data.is_mine) {
            tile.textContent = '💣';
            tile.style.background = '#dc3545';
            endGame('lost', data.payout);
        } else {
            tile.textContent = '✓';
            tile.style.background = '#28a745';
            document.getElementById('revealed').textContent = data.revealed_tiles;
            document.getElementById('multiplier').textContent = data.multiplier.toFixed(2) + 'x';
        }

        if (data.result) {
            endGame(data.result, data.payout);
        }

    } catch (err) {
        alert('Error revealing tile');
    }
}

function cashout() {
    endGame('win', 0);
}

function endGame(result, payout) {
    const resultEl = document.getElementById('result');
    resultEl.classList.remove('hidden');
    
    if (result === 'win') {
        resultEl.className = 'alert alert-success';
        resultEl.textContent = `Won! 🎉 +KES ${payout}`;
    } else {
        resultEl.className = 'alert alert-danger';
        resultEl.textContent = 'Game Over! 💣';
    }

    document.getElementById('startBtn').disabled = false;
    document.getElementById('revealBtn').disabled = true;
    document.getElementById('cashoutBtn').disabled = true;
}
</script>
{% endblock %}
