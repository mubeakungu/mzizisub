{% extends 'base.html' %}
{% block title %}Tower Game - Luck2x Casino{% endblock %}
{% block content %}
<div class="container game-container">
    <div class="mb-4"><h2>🏔️ Tower Game</h2><a href="/games" class="btn btn-secondary">← Back</a></div>
    <div class="row">
        <div class="col-lg-8">
            <div class="card"><div class="card-body">
                <div class="mb-3">
                    <label>Difficulty:</label>
                    <select id="difficulty" class="form-control"><option>easy</option><option>medium</option><option>hard</option></select>
                </div>
                <div class="mb-3"><label>Bet (KES)</label><input type="number" id="betAmount" value="100"></div>
                <button id="startBtn" class="btn btn-primary">START GAME</button>

                <div id="tower" class="tower mt-4"></div>
                <div id="result" class="alert mt-3 hidden"></div>
                <h5 class="mt-3">Level: <span id="level">1</span>/10 | Multiplier: <span id="multiplier">1.0x</span></h5>
            </div></div>
        </div>
        <div class="col-lg-4"><div class="card"><div class="card-body">
            <h5>Tower Game</h5><p>Climb 10 levels by making correct choices.</p><p>Max Win: 6x</p><p>RTP: 95%</p>
        </div></div></div>
    </div>
</div>

<script>
let gameId = null;

document.getElementById('startBtn').addEventListener('click', startTower);

async function startTower() {
    const betAmount = parseFloat(document.getElementById('betAmount').value);
    const difficulty = document.getElementById('difficulty').value;
    const userId = sessionStorage.getItem('user_id');

    const response = await fetch('/api/games/tower/start', {
        method: 'POST',
        headers: {'User-ID': userId, 'Content-Type': 'application/json'},
        body: JSON.stringify({bet_amount: betAmount, difficulty: difficulty})
    });

    const data = await response.json();
    gameId = data.game_id;
    drawTower();
}

function drawTower() {
    const towerEl = document.getElementById('tower');
    towerEl.innerHTML = '';
    for (let i = 0; i < 10; i++) {
        const level = document.createElement('div');
        level.className = 'tower-level';
        level.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;';
        
        for (let j = 0; j < 3; j++) {
            const choice = document.createElement('button');
            choice.className = 'btn btn-outline-primary';
            choice.textContent = j + 1;
            choice.addEventListener('click', () => playLevel(i, j));
            level.appendChild(choice);
        }
        towerEl.appendChild(level);
    }
}

async function playLevel(level, choice) {
    if (!gameId) return;
    const userId = sessionStorage.getItem('user_id');

    const response = await fetch(`/api/games/tower/play/${gameId}`, {
        method: 'POST',
        headers: {'User-ID': userId, 'Content-Type': 'application/json'},
        body: JSON.stringify({choice: choice})
    });

    const data = await response.json();
    document.getElementById('level').textContent = data.level;
    document.getElementById('multiplier').textContent = data.multiplier.toFixed(1) + 'x';

    if (data.result) {
        const resultEl = document.getElementById('result');
        if (data.result === 'win') {
            resultEl.className = 'alert alert-success';
            resultEl.textContent = `Won! 🎉 +KES ${data.payout}`;
        } else {
            resultEl.className = 'alert alert-danger';
            resultEl.textContent = 'Game Over! Lost tower.';
        }
        resultEl.classList.remove('hidden');
    }
}
</script>
{% endblock %}
